[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-voice"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "soundfile>=0.12.1",
  "edge-tts>=6.1.10",
]

[project.scripts]
hermes-voice = "hermes_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
